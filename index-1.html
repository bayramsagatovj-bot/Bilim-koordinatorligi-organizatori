<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><title>Fanlarga qiziqish soʻrovnomasi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--ac:#2563eb;--bd:#e3e6ea;--bad:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1f26;--tx:#eceff3;--mu:#9aa3af;--bd:#2b323b;--ac:#60a5fa}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:14px}.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
h1{font-size:21px;margin:6px 0}h2{font-size:17px;margin:0 0 8px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;width:100%;margin:4px 0}
button{background:var(--ac);color:#fff;border:0;cursor:pointer;font-weight:600}button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--bad)}
.row{display:flex;gap:8px}.row>*{flex:1}.tabs{display:flex;gap:6px;overflow-x:auto}.tabs button{width:auto;white-space:nowrap}
.opt{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--bd);border-radius:8px;margin:5px 0}.opt input{width:auto;margin:0}
.sc{display:flex;gap:6px}.sc label{flex:1;text-align:center;border:1px solid var(--bd);border-radius:8px;padding:10px 0}.sc input{display:none}.sc label:has(input:checked){border-color:var(--ac);color:var(--ac);font-weight:700}
.mu{color:var(--mu);font-size:14px}.bw{background:var(--bd);border-radius:5px;margin:3px 0 10px}.bar{height:10px;background:var(--ac);border-radius:5px}
.ov{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left;white-space:nowrap}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd)}.err{color:var(--bad)}
</style>
</head><body><main id="app"><p class="mu">Yuklanmoqda…</p></main>
<script>
/* ====== SOZLAMA: Supabase > Project Settings > API dan oling ====== */
const SUPABASE_URL="https://uejficvpjwjqolsvyekv.supabase.co", SUPABASE_KEY="sb_publishable_AodwqdYKR3U5byZlGh80FQ_cfT4jlu2";
/* ================================================================== */
let sb;
const VIL=["Qoraqalpogʻiston","Andijon","Buxoro","Fargʻona","Jizzax","Xorazm","Namangan","Navoiy","Qashqadaryo","Samarqand","Sirdaryo","Surxondaryo","Toshkent viloyati","Toshkent shahri"];
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
let me=null,Q=[],mine=false,panel=false,tab="s",flt={vil:"",sinf:""},mode="login";
const deviceId=()=>{let d=ls("dev");if(!d){d=crypto.randomUUID();ls("dev",d)}return d};
const mail=p=>p.replace(/\D/g,"")+"@sorovnoma.app";
const phone=p=>p.replace(/\D/g,"");
const say=(t)=>{const e=$("#err");if(e)e.textContent=t};

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return authView();
  const {data}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
  if(!data){await sb.auth.signOut();return authView()}
  me=data;await loadSurvey();route();
}
async function loadSurvey(){
  const {data}=await sb.from("questions").select("*").eq("active",true).order("ord");Q=data||[];
  const {data:r}=await sb.from("responses").select("user_id").eq("user_id",me.id).maybeSingle();mine=!!r;
}
function top(){return `<div class="c row" style="align-items:center"><span class="mu">${esc(me.ism)}</span>${me.role!=="student"?`<button class="g" onclick="panel=!panel;route()">${panel?"Soʻrovnoma":"Boshqaruv"}</button>`:""}<button class="g" onclick="out()">Chiqish</button></div>`}
async function out(){await sb.auth.signOut();me=null;panel=false;authView()}
function route(){if(panel&&me.role!=="student")return admin();mine?thanks():form()}

/* ---------- kirish / royxatdan otish ---------- */
function authView(){
  const reg=mode==="reg";
  app.innerHTML=`<h1>Fanlarga qiziqish soʻrovnomasi</h1><div class="c"><h2>${reg?"Roʻyxatdan oʻtish":"Kirish"}</h2>
  <input id="tel" inputmode="tel" placeholder="Telefon raqam (998901234567)"><input id="pin" type="password" inputmode="numeric" placeholder="PIN-kod (kamida 6 raqam)">
  ${reg?`<input id="ism" placeholder="Ism familiya"><select id="vil"><option value="">Viloyat</option>${VIL.map(v=>`<option>${v}</option>`).join("")}</select>
  <input id="tuman" placeholder="Tuman / shahar"><input id="maktab" placeholder="Maktab (masalan: 12-maktab)"><select id="sinf"><option value="">Sinf</option>${[...Array(11)].map((_,i)=>`<option>${i+1}</option>`).join("")}</select>
  <p class="mu">PIN-kodni eslab qoling: qayta kirganda shu hisobga tushasiz.</p>`:""}
  <button onclick="${reg?"register":"login"}()">${reg?"Roʻyxatdan oʻtish":"Kirish"}</button><p id="err" class="err"></p>
  <button class="g" onclick="mode='${reg?"login":"reg"}';authView()">${reg?"Hisobim bor — kirish":"Birinchi marta — roʻyxatdan oʻtish"}</button></div>`;
}
async function login(){
  const {error}=await sb.auth.signInWithPassword({email:mail($("#tel").value),password:$("#pin").value});
  if(error)return say("Telefon yoki PIN xato.");init();
}
async function register(){
  const g=i=>$("#"+i).value.trim(),d={ism:g("ism"),viloyat:g("vil"),tuman:g("tuman"),maktab:g("maktab"),sinf:+g("sinf")},t=phone(g("tel")),pin=g("pin");
  if(t.length<9||!d.ism||!d.viloyat||!d.tuman||!d.maktab||!d.sinf)return say("Barcha maydonlarni toʻldiring.");
  if(pin.length<6)return say("PIN kamida 6 belgi.");
  const {data:taken}=await sb.rpc("device_taken",{d:deviceId()});
  if(taken)return say("Bu qurilmadan allaqachon roʻyxatdan oʻtilgan. Iltimos, “Kirish”dan foydalaning.");
  const {data,error}=await sb.auth.signUp({email:mail(t),password:pin});
  if(error)return say(error.message.includes("registered")?"Bu raqam band. Kirish orqali kiring.":"Xato: "+error.message);
  const {error:e2}=await sb.from("profiles").insert({id:data.user.id,telefon:t,device_id:deviceId(),...d});
  if(e2){await sb.auth.signOut();return say("Saqlab boʻlmadi: "+e2.message)}
  init();
}

/* ---------- soʻrovnoma ---------- */
function thanks(){app.innerHTML=top()+`<div class="c"><h1>Rahmat, ${esc(me.ism)}!</h1><p class="mu">Siz soʻrovnomadan oʻtgansiz. Javoblaringiz saqlangan.</p></div>`}
function form(){
  if(!Q.length)return app.innerHTML=top()+'<div class="c"><h1>Soʻrovnoma hali tayyor emas</h1></div>';
  let h=top()+`<h1>Soʻrovnoma</h1>`;
  Q.forEach((q,i)=>{h+=`<div class="c"><h2>${i+1}. ${esc(q.text)}</h2>`;
    if(q.type==="scale")h+=`<div class="mu">1 – umuman qiziq emas, 5 – juda qiziq</div><div class="sc">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="q${q.id}" value="${n}">${n}</label>`).join("")}</div>`;
    else if(q.type==="text")h+=`<textarea id="t${q.id}" rows="3" placeholder="Javobingizni yozing"></textarea>`;
    else h+=(q.options||[]).map(o=>`<label class="opt"><input type="${q.type==="multi"?"checkbox":"radio"}" name="q${q.id}" value="${esc(o)}"> ${esc(o)}</label>`).join("");
    h+="</div>"});
  app.innerHTML=h+'<button onclick="submit()">Yuborish</button><p id="err" class="err"></p>';
}
async function submit(){
  const a={};
  for(const q of Q){if(q.type==="text"){const t=$("#t"+q.id).value.trim();if(!t)return say("Barcha savollarga javob bering.");a[q.id]=t;continue}const v=[...document.querySelectorAll(`[name="q${q.id}"]:checked`)].map(e=>e.value);
    if(!v.length)return say("Barcha savollarga javob bering.");a[q.id]=q.type==="multi"?v:v[0]}
  const {error}=await sb.from("responses").insert({user_id:me.id,answers:a});
  if(error)return say("Yuborib boʻlmadi: "+error.message);mine=true;thanks();
}

/* ---------- boshqaruv paneli ---------- */
async function admin(){
  const T=[["s","Savollar"],["n","Natijalar"],["a","Tahlil"]];if(me.role==="admin")T.push(["k","Koordinatorlar"]);
  const h=top()+`<div class="tabs">${T.map(([k,n])=>`<button class="${tab===k?"":"g"}" onclick="tab='${k}';admin()">${n}</button>`).join("")}</div><div id="pv"><p class="mu">Yuklanmoqda…</p></div>`;
  app.innerHTML=h;const pv=$("#pv");
  pv.innerHTML=await({s:qView,n:nView,a:aView,k:kView}[tab])();
}
async function qView(){
  const {data}=await sb.from("questions").select("*").eq("active",true).order("ord");Q=data||[];
  return `<div class="c"><h2>Yangi savol</h2><textarea id="qt" rows="2" placeholder="Savol matni"></textarea>
  <select id="qy" onchange="qt2(this.value)"><option value="text">Ochiq javob (oʻzi yozadi)</option><option value="scale">Baho 1–5 (fan boʻyicha qiziqish)</option><option value="choice">Bitta tanlov</option><option value="multi">Koʻp tanlov</option></select>
  <input id="qf" style="display:none" placeholder="Fan nomi (masalan: Matematika)"><textarea id="qo" rows="3" style="display:none" placeholder="Variantlar, har biri yangi qatorda"></textarea>
  <button onclick="addQ()">Savol qoʻshish</button></div>`+Q.map((q,i)=>`<div class="c"><span class="tag">${q.type==="scale"?"Baho · "+esc(q.subject):q.type==="text"?"Ochiq javob":q.type==="multi"?"Koʻp tanlov":"Tanlov"}</span><p>${i+1}. ${esc(q.text)}</p><button class="d" onclick="delQ(${q.id})">Oʻchirish</button></div>`).join("");
}
function qt2(v){$("#qo").style.display=(v==="choice"||v==="multi")?"block":"none";$("#qf").style.display=v==="scale"?"block":"none"}
async function addQ(){
  const text=$("#qt").value.trim(),type=$("#qy").value,q={text,type};if(!text)return;
  if(type==="scale"){q.subject=$("#qf").value.trim();if(!q.subject)return alert("Fan nomini kiriting")}
  else if(type!=="text"){q.options=$("#qo").value.split("\n").map(s=>s.trim()).filter(Boolean);if(q.options.length<2)return alert("Kamida 2 variant")}
  const {error}=await sb.from("questions").insert(q);if(error)alert(error.message);admin();
}
async function delQ(id){if(confirm("Savol oʻchirilsinmi? (Eski javoblar saqlanadi)")){await sb.from("questions").update({active:false}).eq("id",id);admin()}}
function fbar(){return `<div class="c row"><select onchange="flt.vil=this.value;admin()"><option value="">Barcha viloyatlar</option>${VIL.map(v=>`<option ${flt.vil===v?"selected":""}>${v}</option>`).join("")}</select><select onchange="flt.sinf=this.value;admin()"><option value="">Barcha sinflar</option>${[...Array(11)].map((_,i)=>`<option ${flt.sinf==i+1?"selected":""}>${i+1}</option>`).join("")}</select></div>`}
function rq(sel,opts){let q=sb.from("responses").select(sel,opts).order("created_at",{ascending:false});
  if(flt.vil)q=q.eq("profiles.viloyat",flt.vil);if(flt.sinf)q=q.eq("profiles.sinf",+flt.sinf);return q}
async function nView(){
  const S="created_at,answers,profiles!inner(ism,telefon,viloyat,tuman,maktab,sinf)";
  const {data,count}=await rq(S,{count:"exact"}).range(0,49);
  return fbar()+`<div class="c"><h2>Qatnashganlar: ${count??0}</h2><button onclick="exportCsv()">Excel (CSV) yuklab olish</button><p class="mu">Oxirgi 50 ta koʻrsatilgan, CSV da hammasi bor.</p><div class="ov"><table><tr><th>Ism</th><th>Telefon</th><th>Viloyat</th><th>Tuman</th><th>Maktab</th><th>Sinf</th></tr>${(data||[]).map(r=>{const p=r.profiles;return `<tr><td>${esc(p.ism)}</td><td>${esc(p.telefon)}</td><td>${esc(p.viloyat)}</td><td>${esc(p.tuman)}</td><td>${esc(p.maktab)}</td><td>${p.sinf}</td></tr>`}).join("")}</table></div></div>`;
}
async function exportCsv(){
  const S="created_at,answers,profiles!inner(ism,telefon,viloyat,tuman,maktab,sinf)",rows=[];
  const {data:qs}=await sb.from("questions").select("id,text").order("ord");
  for(let i=0;;i+=1000){const {data}=await rq(S).range(i,i+999);rows.push(...(data||[]));if(!data||data.length<1000)break}
  const c=v=>`"${String(Array.isArray(v)?v.join("; "):v??"").replace(/"/g,'""')}"`;
  const head=["Ism","Telefon","Viloyat","Tuman","Maktab","Sinf","Sana",...qs.map(q=>q.text)];
  const lines=[head.map(c).join(",")];
  rows.forEach(r=>{const p=r.profiles;lines.push([p.ism,p.telefon,p.viloyat,p.tuman,p.maktab,p.sinf,r.created_at,...qs.map(q=>r.answers[q.id])].map(c).join(","))});
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv"}));a.download="natijalar.csv";a.click();
}
async function aView(){
  const {data,error}=await sb.rpc("analytics",{p_vil:flt.vil||null,p_sinf:flt.sinf?+flt.sinf:null});
  if(error)return fbar()+`<div class="c err">${esc(error.message)}</div>`;
  if(!data.total)return fbar()+'<div class="c mu">Hali javoblar yoʻq.</div>';
  const S=data.subjects;
  let h=fbar()+`<div class="c"><h2>Fanlarga talab (oʻrtacha baho, 5 dan) · ${data.total} kishi</h2>`+(S.length?S.map((f,i)=>`<div>${esc(f.subject)} <b>${f.avg}</b> ${i===0?'<span class="tag">eng yuqori talab</span>':i===S.length-1&&S.length>1?'<span class="tag">eng past talab</span>':""}</div><div class="bw"><div class="bar" style="width:${f.avg*20}%"></div></div>`).join(""):'<span class="mu">Baho turidagi savollar yoʻq.</span>')+"</div>";
  const by={};data.options.forEach(o=>(by[o.qid]=by[o.qid]||{t:o.text,l:[]}).l.push(o));
  Object.values(by).forEach(g=>{const mx=Math.max(...g.l.map(o=>o.n));
    h+=`<div class="c"><h2>${esc(g.t)}</h2>`+g.l.map(o=>`<div>${esc(o.opt)} <b>${o.n}</b> <span class="mu">(${Math.round(o.n/data.total*100)}%)</span></div><div class="bw"><div class="bar" style="width:${o.n/mx*100}%"></div></div>`).join("")+"</div>"});
  const tq=Q.filter(q=>q.type==="text");
  if(tq.length){const {data:rs}=await rq("answers,profiles!inner(viloyat,sinf)").limit(300);
    tq.forEach(q=>{h+=`<div class="c"><h2>${esc(q.text)}</h2><p class="mu">Oxirgi javoblar (toʻliq roʻyxat CSV da):</p>`+(rs||[]).map(r=>r.answers[q.id]).filter(Boolean).slice(0,30).map(t=>`<div class="opt">${esc(t)}</div>`).join("")+"</div>"})}
  return h;
}
async function kView(){
  const {data}=await sb.from("profiles").select("id,ism,telefon,role,maktab").neq("role","student");
  return `<div class="c"><h2>Koordinator tayinlash</h2><p class="mu">Tayinlanadigan odam avval saytda roʻyxatdan oʻtgan boʻlishi kerak.</p><input id="ks" inputmode="tel" placeholder="Telefon raqam"><button onclick="findK()">Qidirish</button><div id="kr"></div></div>
  <div class="c"><h2>Hozirgi koordinatorlar</h2>${(data||[]).map(p=>`<div class="opt" style="justify-content:space-between"><span>${esc(p.ism)} · ${esc(p.telefon)} <span class="tag">${p.role}</span></span>${p.id!==me.id?`<button class="d" style="width:auto" onclick="setRole('${p.id}','student')">Olib tashlash</button>`:""}</div>`).join("")}</div>`;
}
async function findK(){
  const {data}=await sb.from("profiles").select("id,ism,telefon,maktab,role").ilike("telefon","%"+phone($("#ks").value)+"%").limit(10);
  $("#kr").innerHTML=(data||[]).map(p=>`<div class="opt" style="flex-wrap:wrap"><span style="flex:1">${esc(p.ism)} · ${esc(p.telefon)} · ${esc(p.maktab)} <span class="tag">${p.role}</span></span><button style="width:auto" onclick="setRole('${p.id}','coordinator')">Koordinator</button><button class="g" style="width:auto" onclick="setRole('${p.id}','admin')">Admin</button></div>`).join("")||'<p class="mu">Topilmadi.</p>';
}
async function setRole(id,role){const {error}=await sb.rpc("set_role",{target:id,new_role:role});if(error)alert(error.message);admin()}
const showErr=m=>{app.innerHTML='<div class="c err"><b>Xato:</b> '+esc(m)+'</div>'};
window.onerror=m=>showErr(m);
window.addEventListener("unhandledrejection",e=>showErr((e.reason&&e.reason.message)||e.reason));
const LIBS=["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js","https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"];
function lib(i){
  if(i>=LIBS.length)return showErr("Kutubxona yuklanmadi. Internetni tekshiring.");
  const s=document.createElement("script");s.src=LIBS[i];
  s.onload=()=>{sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);init()};
  s.onerror=()=>lib(i+1);document.head.appendChild(s);
}
lib(0);
</script></body></html>
